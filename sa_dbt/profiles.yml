starke_analytics:
  target: prod
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH') }}"
      schema: dbt_dev
    prod:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH') }}"
      schema: dbt_prod # This will switch the schema structure provided in the dbt_project.yml file
