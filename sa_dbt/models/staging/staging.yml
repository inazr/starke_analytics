version: 2

models:
  - name: stg_employees
    data_tests:
      - unique:
          arguments:
            column_name: "employee_id || '-' || valid_from"
    columns:
      - name: employee_id
        data_tests:
          - not_null

  - name: stg_appointments
    columns:
      - name: appointment_id
        data_tests:
          - unique
          - not_null

  - name: stg_receipts
    columns:
      - name: receipt_id
        data_tests:
          - unique
          - not_null

  - name: stg_invoices
    columns:
      - name: invoice_id
        data_tests:
          - unique
          - not_null
      - name: receipt_id
        data_tests:
          # Receipts should never be deleted in Starke, but 7 invoices point to missing ones
          - relationships:
              arguments:
                to: ref('stg_receipts')
                field: receipt_id
              config:
                severity: warn

  - name: stg_invoice_line_items
    columns:
      - name: invoice_line_item_id
        data_tests:
          - unique
          - not_null

  - name: stg_employee_payments
    data_tests:
      - unique:
          arguments:
            column_name: "payment_month || '-' || employee_short"
    columns:
      - name: payment_month
        data_tests:
          - not_null
      - name: employee_short
        data_tests:
          - not_null
