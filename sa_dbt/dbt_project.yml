
name: 'sa_dbt'
version: '1.0.0'
config-version: 2

profile: 'starke_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

flags:
  send_anonymous_usage_stats: false
  partial_parse: false
  version_check: false

models:
  sa_dbt:
    core:
      +schema: core
      +materialized: table

    # Copied to Superset together with core (SUPERSET_SCHEMAS in sa_dagster/assets/assets.py)
    reporting:
      +schema: reporting
      +materialized: table

    staging:
      starke_praxis:
        +schema: stg_starke
        +tags: stg_starke
      # Hand-maintained CSV seeds (seeds/), not from Starke
      seeds:
        +schema: stg_seeds
