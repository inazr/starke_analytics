[project]
name = "starke_analytics"
version = "0.1.0"
requires-python = ">=3.13,<3.14"  # dagster-dbt does not support 3.14 yet
dependencies = [
    "dagster>=1.13",
    "dagster-webserver>=1.13",
    "dagster-graphql>=1.13",
    "dagster-dbt>=0.29",
    "dagster-duckdb>=0.29",
    "dbt-core>=1.12",
    "dbt-duckdb>=1.11",
    "duckdb>=1.5",
    "pandas>=3.0",
    "sqlalchemy>=2.1",
    "pyodbc>=5.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=9.1"]

[tool.uv]
package = false  # nothing to install: dagster loads the code from sa_dagster/

[tool.dagster]
module_name = "sa_dagster.sa_dagster"  # folder sa_dagster/, package sa_dagster/
code_location_name = "sa_dagster"  # reload_code_location reloads it by this name
